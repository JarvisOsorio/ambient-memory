name: Materialize package-lock

on:
  push:
    paths:
      - ".github/lock-seed/**"
      - ".github/workflows/materialize-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode package-lock.json
        run: |
          python3 <<'PY'
          import gzip, base64, pathlib, hashlib, sys
          parts = sorted(pathlib.Path(".github/lock-seed").glob("part-*.b64"))
          if not parts:
            print("no parts"); sys.exit(1)
          raw = "".join(p.read_text().strip() for p in parts)
          # Repair known MCP transcription corruption (fi ligature)
          if "Tvfls8" in raw and "Tvfix8" not in raw:
            raw = raw.replace("Tvfls8", "Tvfix8", 1)
            print("applied Tvfls8->Tvfix8 repair")
          print("parts", len(parts), "b64_len", len(raw))
          data = gzip.decompress(base64.b64decode(raw))
          if len(data) < 1000:
            print("too small", len(data)); sys.exit(1)
          got = hashlib.sha256(data).hexdigest()
          expect = "ca65407da1c984789fb0bb13603159b0c867250d70981561720b30aa574ffa72"
          if got != expect:
            print("hash mismatch", got); sys.exit(1)
          pathlib.Path("package-lock.json").write_bytes(data)
          print("wrote", len(data), got)
          PY
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "Add package-lock.json for reproducible installs"
          git push
