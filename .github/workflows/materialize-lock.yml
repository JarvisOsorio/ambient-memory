name: Materialize package-lock

on:
  push:
    paths:
      - ".github/package-lock.json.gz.b64"
      - ".github/workflows/materialize-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode package-lock.json
        run: |
          python3 <<'PY'
          import gzip, base64, pathlib, hashlib
          b64 = pathlib.Path(".github/package-lock.json.gz.b64").read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          path = pathlib.Path("package-lock.json")
          path.write_bytes(data)
          print("wrote", path, "bytes", len(data), "sha256", hashlib.sha256(data).hexdigest())
          PY
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add package-lock.json for reproducible installs"
          git push
