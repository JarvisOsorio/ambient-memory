name: Set topics

on:
  push:
    paths:
      - ".github/workflows/set-topics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Best-effort topics
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.replaceAllTopics({
                owner: context.repo.owner,
                repo: context.repo.repo,
                names: ["mcp","ai","memory","local-first","sqlite","cursor","claude"],
              });
              console.log("topics set");
            } catch (e) {
              console.log("topics skipped", e.status, e.message);
              core.setFailed("topics require admin; set manually in About");
            }
