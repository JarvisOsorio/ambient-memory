name: Bootstrap meta

on:
  push:
    paths:
      - ".github/workflows/bootstrap-meta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.2.1 release (and try topics)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Topics require admin on some orgs; best-effort only.
            try {
              await github.rest.repos.replaceAllTopics({
                owner,
                repo,
                names: ["mcp", "ai", "memory", "local-first"],
              });
              console.log("topics set");
            } catch (e) {
              console.log("topics skipped:", e.status, e.message);
            }

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: "v0.2.1" });
              console.log("release v0.2.1 already exists");
            } catch (e) {
              if (e.status !== 404) throw e;
              const release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: "v0.2.1",
                name: "ambient-memory v0.2.1",
                target_commitish: "main",
                body: [
                  "Zero-config local ambient memory for AI agents — encrypted SQLite + MCP.",
                  "",
                  "### Highlights",
                  "- FTS5 OR multi-term search with coverage boosts",
                  "- Seal-at-rest vault (`memory.db.enc`)",
                  "- MCP tools/resources/prompts for Cursor / Claude Desktop",
                  "- Honest doctor + clean npm audit (Zod override)",
                  "",
                  "See CHANGELOG.md for full notes.",
                ].join("\n"),
                draft: false,
                prerelease: false,
              });
              console.log("created release", release.data.html_url);
            }
