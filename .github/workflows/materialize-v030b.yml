name: materialize-v030b
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/v030b-seed/**'
      - '.github/workflows/materialize-v030b.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Decode hex seed
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, gzip, pathlib
          seed = pathlib.Path('.github/v030b-seed')
          meta = json.loads((seed/'meta.json').read_text())
          hexdata = ''
          for part in meta['parts']:
              raw = (seed/part['name']).read_text().strip()
              # MCP sometimes corrupted hex '301' → 'img'; repair before verify
              if 'img' in raw:
                  raw = raw.replace('img', '301')
              assert hashlib.sha256(raw.encode()).hexdigest() == part['sha256'], part['name']
              assert len(raw) == part['len'], part['name']
              hexdata += raw
          gz = bytes.fromhex(hexdata)
          assert hashlib.sha256(gz).hexdigest() == meta['gzSha256']
          payload = gzip.decompress(gz)
          assert hashlib.sha256(payload).hexdigest() == meta['payloadSha256']
          files = json.loads(payload)
          assert len(files) == meta['fileCount']
          for f in files:
              path = pathlib.Path(f['path'])
              path.parent.mkdir(parents=True, exist_ok=True)
              data = f['content'].encode('utf-8')
              path.write_bytes(data)
              blob = b'blob %d\0'%len(data) + data
              sha = hashlib.sha1(blob).hexdigest()
              assert sha == meta['fileShas'][f['path']], (f['path'], sha, meta['fileShas'][f['path']])
              print('wrote', f['path'], sha)
          PY
      - name: Commit files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "v0.3.0: materialize remaining large sources + package-lock"
          git push
      - name: Cleanup seed
        run: |
          set -euo pipefail
          rm -rf .github/v030b-seed .github/workflows/materialize-v030b.yml .github/v030-seed
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove v0.3.0 materialize seeds"
          git push
