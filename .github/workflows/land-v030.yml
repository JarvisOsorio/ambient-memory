name: Land v0.3.0

on:
  push:
    paths:
      - ".github/workflows/land-v030.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Merge branch into main, release, topics
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = "cursor/v030-engineering-response-9bf2";

            // Merge feature branch into main
            const merge = await github.rest.repos.merge({
              owner,
              repo,
              base: "main",
              head,
              commit_message:
                "release: v0.3.0 — daemon IPC, node:sqlite/WASM, noise control, npx readiness",
            });
            console.log("merge status", merge.status, merge.data?.sha);

            // Topics (best-effort)
            try {
              await github.rest.repos.replaceAllTopics({
                owner,
                repo,
                names: ["mcp", "ai", "memory", "local-first", "sqlite", "cursor", "claude"],
              });
              console.log("topics set");
            } catch (e) {
              console.log("topics skipped", e.status, e.message);
            }

            // GitHub Release v0.3.0
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: "v0.3.0" });
              console.log("release already exists");
            } catch (e) {
              if (e.status !== 404) throw e;
              const release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: "v0.3.0",
                name: "ambient-memory v0.3.0",
                target_commitish: "main",
                body: [
                  "Zero-config local ambient memory for AI agents — encrypted vault + MCP, **no native C++ install**.",
                  "",
                  "### Highlights",
                  "- **True zero-config install** — Node `node:sqlite` (22+) + `sql.js` WASM fallback (20+); no better-sqlite3 / node-gyp",
                  "- **Daemon-owned vault** — CLI and `ambient mcp` are thin IPC clients (Unix socket / Windows named pipe)",
                  "- **npx-ready** — `npx -y ambient-memory mcp` (after npm publish)",
                  "- **Honest crypto** — AES-GCM field encryption + sealed `.enc` at rest; FTS is redacted plaintext while unlocked (documented)",
                  "- **Noise control** — Slack/Spotify/etc. filtered; focus dedupe + session summarization for `memory_context`",
                  "",
                  "### Quick start",
                  "```bash",
                  "npx -y ambient-memory init",
                  "npx -y ambient-memory start --screen auto",
                  "npx -y ambient-memory mcp",
                  "```",
                  "",
                  "Cursor / Claude MCP:",
                  "```json",
                  "{ \"mcpServers\": { \"ambient-memory\": { \"command\": \"npx\", \"args\": [\"-y\", \"ambient-memory\", \"mcp\"] } } }",
                  "```",
                  "",
                  "See CHANGELOG.md and SECURITY.md for full notes.",
                ].join("\n"),
                draft: false,
                prerelease: false,
              });
              console.log("created release", release.data.html_url);
            }
